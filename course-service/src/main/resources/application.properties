spring.application.name=course-service

# ==================== SERVER ====================
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api/course-service
# ==================== DATABASE (PostgreSQL) ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://144.91.120.200:5432/my-udemy-course?options=-c%20TimeZone%3DAsia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Admin@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==================== LIQUIBASE ====================
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.xml}

# ==================== REDIS ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:my-secret-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==================== SPRINGDOC / SWAGGER ====================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
openapi.gateway-url=${GATEWAY_URL:http://localhost:8000}

springdoc.swagger-ui.operations-sorter=alpha      # sắp xếp endpoint theo tên
springdoc.swagger-ui.tags-sorter=alpha            # sắp xếp tag theo tên
springdoc.default-produces-media-type=application/json

# ==================== LOGGING ====================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.thanghub=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
