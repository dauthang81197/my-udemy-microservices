server.port=8000

# ===== ROUTES =====
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth-service/**

spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/course-service/**

# ===== SWAGGER ROUTES =====
spring.cloud.gateway.routes[2].id=auth-service-swagger
spring.cloud.gateway.routes[2].uri=http://localhost:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/aggregate/auth-service/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/aggregate/auth-service/(?<segment>.*), /api/auth-service/${segment}

spring.cloud.gateway.routes[3].id=course-service-swagger
spring.cloud.gateway.routes[3].uri=http://localhost:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/aggregate/course-service/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/aggregate/course-service/(?<segment>.*), /api/course-service/${segment}

# ===== SWAGGER UI =====
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/aggregate/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=course-service
springdoc.swagger-ui.urls[1].url=/aggregate/course-service/v3/api-docs

# ===== MULTIPART / CODEC =====
spring.codec.max-in-memory-size=500MB

# ===== JWT =====
jwt.secret=my-secret-key-change-this-in-production

# ===== MANAGEMENT =====
management.endpoints.web.exposure.include=*

# ===== LOGGING =====
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.thanghub=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}