server.port=8000

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/courses/**

management.endpoints.web.exposure.include=*
spring.security.oauth2.resourceserver.jwt.secret-key=your-secret
# ==================== SPRINGDOC / SWAGGER ====================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}

springdoc.swagger-ui.operations-sorter=alpha      # sắp xếp endpoint theo tên
springdoc.swagger-ui.tags-sorter=alpha            # sắp xếp tag theo tên
springdoc.default-produces-media-type=application/json

# ==================== LOGGING ====================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.thanghub=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
